; BlueJay — Unit GPS v1.1 (AT6668) sighting logger.
; Supported controllers (pick one with `pio run -e <env>`):
;   m5stack-sticks3  — M5StickS3 (default)
;   m5stack-atoms3r  — M5 AtomS3R
;   m5stack-cardputer-adv — M5 Cardputer ADV
; All follow M5Stack's documented PlatformIO environments.

[platformio]
default_envs = m5stack-sticks3

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_upload.flash_size = 8MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Keep local paths out of published binaries.
    -fmacro-prefix-map=${platformio.core_dir}=.
    -fmacro-prefix-map=$PROJECT_DIR=.
; Pinned so every build uses the library versions the firmware was tested with.
lib_deps =
    ; M5GFX comes first, or M5Unified's dependency installs a newer copy too.
    m5stack/M5GFX@0.2.36
    https://github.com/m5stack/M5Unified#44952cb8e4ac88bf04ad23b9dfd6f4b05c788348
    mikalhart/TinyGPSPlus@^1.1.0

[env:m5stack-sticks3]
build_flags =
    ${env.build_flags}
    -DBJ_BOARD_STICKS3
; Blue jay call played on each successful log (see data/README.md).
board_build.embed_files = data/bluejaycall.wav
lib_deps =
    ${env.lib_deps}
    https://github.com/m5stack/M5PM1#315d2899c863ae34b59197392b9f4c59490751ef

[env:m5stack-atoms3r]
build_flags =
    ${env.build_flags}
    -DBJ_BOARD_ATOMS3R

[env:m5stack-cardputer-adv]
; The Cardputer ADV has no PSRAM.
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${env.build_flags}
    -DBJ_BOARD_CARDPUTER_ADV
build_unflags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
board_build.embed_files = data/bluejaycall.wav
