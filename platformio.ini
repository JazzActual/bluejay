; BlueJay — Unit GPS v1.1 (AT6668) sighting logger.
; Supported controllers (pick one with `pio run -e <env>`):
;   m5stack-sticks3  — M5StickS3 (default)
;   m5stack-atoms3r  — M5 AtomS3R
; Both follow M5Stack's documented PlatformIO environments.

[platformio]
default_envs = m5stack-sticks3

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_upload.flash_size = 8MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    https://github.com/m5stack/M5Unified
    mikalhart/TinyGPSPlus@^1.1.0

[env:m5stack-sticks3]
build_flags =
    ${env.build_flags}
    -DBJ_BOARD_STICKS3
; Blue jay call played on each successful log (see data/README.md).
board_build.embed_files = data/bluejaycall.wav
lib_deps =
    ${env.lib_deps}
    https://github.com/m5stack/M5PM1

[env:m5stack-atoms3r]
build_flags =
    ${env.build_flags}
    -DBJ_BOARD_ATOMS3R
